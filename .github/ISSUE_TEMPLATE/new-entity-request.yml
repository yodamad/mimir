name: New entity request
description: Suggest a god, goddess, hero, or other entity to add to an existing mythology in Mimir
title: "[New Entity] "
labels: ["new-entity-request"]
body:
  - type: input
    id: entity_name
    attributes:
      label: Entity name
      description: The name of the god, goddess, hero, or other figure you'd like added
      placeholder: e.g. Hades
    validations:
      required: true
  - type: dropdown
    id: mythology
    attributes:
      label: Mythology
      description: >-
        Which existing mythology does this entity belong to? Don't see it listed —
        use the "New mythology request" form instead.
      # Keep in sync with MYTHOLOGY_NAMES in src/data/mythologies.ts.
      options:
        - Greek
        - Lord of the Rings
        - Star Wars
    validations:
      required: true
